kind = "web"
previewPath = "/"
title = "Luxxy Motors Stock Viewer"
description = "A mobile-first used-car stock website for Luxxy Motors in Harrow. Users upload current-stock JSON, browse and filter vehicles, inspect full photo galleries and specifications, and retain the latest upload locally between visits."
version = "1.0.0"
id = "artifacts/luxxy-motors"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23084

[services.development]
run = "pnpm --filter @workspace/luxxy-motors run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/luxxy-motors", "run", "build" ]
serve = "static"
publicDir = "artifacts/luxxy-motors/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23084"
BASE_PATH = "/"
