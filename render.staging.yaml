# Proposed billable staging resources. Do not sync/create until the operator
# approves the Render workspace, plans, region and published code revision.
# Select this file explicitly as the Blueprint path (it is not render.yaml).
services:
  - type: web
    name: luxxy-stock-staging
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build
    startCommand: PUBLIC_SITE_URL="${PUBLIC_SITE_URL:-$RENDER_EXTERNAL_URL}" corepack pnpm start
    healthCheckPath: /api/healthz
    disk:
      name: private-integration-settings
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: DATABASE_URL
        fromDatabase:
          name: luxxy-stock-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: INTEGRATIONS_ENCRYPTION_KEY
        generateValue: true
      - key: INTEGRATIONS_PRIVATE_DIR
        value: /var/data/dealer-integrations
      - key: STOCK_DEALER_ID
        value: paramount-staging
      - key: STOCK_RETAILER_ID
        value: "10045264"
      - key: STOCK_IMPORT_SECRET
        generateValue: true
      - key: STOCK_MAX_AGE_HOURS
        value: "24"
      - key: STOCK_MAX_DROP_PERCENT
        value: "30"
      - key: STOCK_MIN_PRICE
        value: "500"
      - key: STOCK_MAX_PRICE_CHANGE_PERCENT
        value: "50"
      - key: STOCK_MISSING_HIDE_THRESHOLD
        value: "2"
      - key: STOCK_STALE_AFTER_HOURS
        value: "36"
      - key: DEALER_TIMEZONE
        value: Europe/London
      - key: RESEND_ENABLED
        value: "false"
      - key: RESERVATION_PAYMENT_MODE
        value: disabled
      - key: CLERK_PROXY_ENABLED
        value: "false"
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: PORTAL_STAFF_EMAILS
        sync: false

databases:
  - name: luxxy-stock-staging-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "16"
    databaseName: luxxy_stock_staging_db
    user: luxxy_stock_staging_db_user
    # Restrict public database connections; service uses internal connectionString.
    ipAllowList: []
