components:
  schemas:
    OnlineReservationPartExchange:
      type: object
      additionalProperties: false
      properties:
        registration: { type: string, minLength: 2, maxLength: 16 }
        mileage: { type: number, multipleOf: 1, minimum: 0, maximum: 1000000 }
      required: [registration, mileage]
    OnlineReservationInput:
      type: object
      additionalProperties: false
      properties:
        vehicleId: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' }
        idempotencyKey: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' }
        customerName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, maxLength: 254, pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$' }
        phone: { type: string, minLength: 5, maxLength: 40 }
        expectedPricePence: { type: number, multipleOf: 1, minimum: 1, maximum: 2147483647 }
        expectedDepositPence: { type: number, multipleOf: 1, minimum: 100, maximum: 1000000 }
        termsAccepted: { type: boolean, enum: [true] }
        terms: { type: string, minLength: 1, maxLength: 4000 }
        partExchange: { $ref: "#/components/schemas/OnlineReservationPartExchange" }
      required: [vehicleId, idempotencyKey, customerName, email, phone, expectedPricePence, expectedDepositPence, termsAccepted, terms]
    OnlineReservation:
      type: object
      additionalProperties: false
      properties: &onlineReservationProperties
        id: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' }
        reference: { type: string }
        vehicleId: { type: string }
        vehicleTitle: { type: string }
