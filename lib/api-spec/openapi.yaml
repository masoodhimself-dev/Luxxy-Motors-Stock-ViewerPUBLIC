openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stock
    description: Shared showroom stock
  - name: enquiries
    description: Customer enquiries and viewing requests
  - name: leads
    description: Buyer leads and their timeline, whatever channel they arrived on
  - name: sales
    description: Development-only dealer sales foundation
  - name: signing
    description: Development-only customer signing sessions
  - name: customer-intake
    description: Customer self-entry sessions for starting a dealer sale
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stock:
    get:
      operationId: getStock
      tags: [stock]
      summary: Get current showroom stock
      description: Returns the current full stock snapshot persisted in the database.
      responses:
        "200":
          description: Current showroom stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"
  /stock/imports/autotrader:
    post:
      operationId: importAutotraderStock
      tags: [stock]
      summary: Import a full Auto Trader stock snapshot
      description: Reconciles the database to the supplied complete Auto Trader snapshot. Schema version 1 is the only supported version.
      parameters:
        - in: header
          name: x-stock-import-secret
          required: true
          description: Shared secret used to authenticate the stock importer.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockImportEnvelope"
      responses:
        "201":
          description: Full snapshot imported for the first time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportResult"
        "200":
          description: Idempotent replay of a previously imported run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportResult"
        "400":
          description: Import envelope failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "401":
          description: Missing or invalid import secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "409":
          description: The run ID conflicts with an existing non-replayable import run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "422":
          description: Import was quarantined because its source records could not be safely applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "500":
          description: Unexpected processing or server configuration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [stock]
      summary: Get a vehicle
      parameters:
        - in: path
          name: id
          required: true
          description: Database identifier of the vehicle.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Vehicle details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /enquiries:
    get:
      operationId: getEnquiries
      tags: [enquiries]
      summary: List customer enquiries
      description: Returns customer enquiries for the configured dealer, newest first.
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [new, contacted, closed]
      responses:
        "200":
          description: Customer enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"
        "500":
          description: Unable to load enquiries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Create a customer enquiry
      description: Stores a website enquiry and snapshots the selected visible vehicle when provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Enquiry failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Selected vehicle was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to create enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /enquiries/availability:
    get:
      operationId: getEnquiryAvailability
      tags: [enquiries]
      summary: Get available viewing appointments
      description: Returns bookable 30-minute viewing slots for a date in the dealership timezone.
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Viewing availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryAvailability"
        "400":
          description: Invalid or unavailable date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to load availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /enquiries/{id}/status:
    patch:
      operationId: updateEnquiryStatus
      tags: [enquiries]
      summary: Update enquiry status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryStatusUpdate"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Enquiry failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to update enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      summary: List leads
      description: Returns leads for the configured dealer, newest first, whatever channel they arrived on.
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - in: query
          name: stage
          required: false
          schema:
            type: string
            enum: [open, all, new, qualifying, viewing_booked, offer, reserved, sale_agreed, collected, won, lost]
        - in: query
          name: source
          required: false
          schema:
            type: string
            enum: [all, website_form, phone, whatsapp, walk_in, marketplace, social]
        - in: query
          name: owner
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - in: query
          name: state
          required: false
          description: Limit to leads that are still live or already closed.
          schema:
            type: string
            enum: [open, closed]
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid lead filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to load leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead by hand
      description: Records a lead that arrived by phone, WhatsApp, walk-in, marketplace or social, rather than through the website form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Lead failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Selected vehicle was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to create lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead with its timeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Lead with its timeline and any sales it produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Invalid lead id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to load lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead details from the dealer portal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Update failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorised for the portal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads/{id}/touches:
    post:
      operationId: logLeadTouch
      tags: [leads]
      summary: Log a touch against a lead
      description: Appends a call, message, email, visit or note to the lead timeline. Contact touches also move the last contacted time on.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadTouchInput"
      responses:
        "201":
          description: Lead with the touch appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Touch failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to log the touch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads/{id}/stage:
    post:
      operationId: updateLeadStage
      tags: [leads]
      summary: Move a lead to another stage
      description: Moves a live lead between stages. Closing a lead is done by recording an outcome, not by setting a stage.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadStageUpdate"
      responses:
        "200":
          description: Lead at its new stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Stage change failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The lead cannot move to that stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to change the stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads/{id}/owner:
    post:
      operationId: assignLeadOwner
      tags: [leads]
      summary: Assign the person who owns a lead
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadOwnerUpdate"
      responses:
        "200":
          description: Lead with its owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Owner failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to assign the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads/{id}/next-action:
    post:
      operationId: setLeadNextAction
      tags: [leads]
      summary: Set what happens next on a lead and when
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadNextActionUpdate"
      responses:
        "200":
          description: Lead with its next action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Next action failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to set the next action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads/{id}/outcome:
    post:
      operationId: closeLead
      tags: [leads]
      summary: Close a lead with an outcome
      description: Closes a lead as won or lost. Both an outcome and a reason are required.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadOutcomeInput"
      responses:
        "200":
          description: Closed lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Outcome failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The lead is already closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to close the lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customer-intake-sessions:
    post:
      operationId: createCustomerIntakeSession
      tags: [customer-intake]
      summary: Create a customer self-entry session
      description: Creates a short-lived link that lets a customer enter their own details before a development sale is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerIntakeSessionInput"
      responses:
        "201":
          description: Customer self-entry session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerIntakeSession"
        "400":
          description: Session request failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customer-intake-sessions/{token}:
    get:
      operationId: getCustomerIntakeSession
      tags: [customer-intake]
      summary: Get a customer self-entry session
      description: Returns the current status of a short-lived customer details session.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "200":
          description: Customer self-entry session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerIntakeSession"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Session expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customer-intake-sessions/{token}/complete:
    post:
      operationId: completeCustomerIntakeSession
      tags: [customer-intake]
      summary: Save customer-entered details
      description: Stores customer details against a self-entry session so the dealer can use them when creating a sale.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            minLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerIntakeCompletionInput"
      responses:
        "200":
          description: Customer details saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerIntakeSession"
        "400":
          description: Customer details failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Session has already been completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Session expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales:
    get:
      operationId: getSales
      tags: [sales]
      summary: List development sales
      description: Development-only sales list. Staff authentication is required before production use.
      responses:
        "200":
          description: Development sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "500":
          description: Unable to load sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createSale
      tags: [sales]
      summary: Create a development sale
      description: Creates a draft sale against one existing vehicle and customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Development sale created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          description: Sale failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Vehicle already has an active sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get a development sale
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Development sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "404":
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/{id}/checklist:
    get:
      operationId: getSaleChecklist
      tags: [sales]
      summary: Get the deal readiness checklist
      description: Returns the auditable readiness items for a development sale and whether it can be prepared for signing.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deal readiness checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleChecklist"
        "404":
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/{id}/checklist/{code}:
    post:
      operationId: updateSaleChecklistItem
      tags: [sales]
      summary: Confirm or reset a deal readiness item
      description: Records an auditable staff confirmation against the current sale data. Confirmations are invalidated when the underlying deal data changes.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: code
          required: true
          schema:
            $ref: "#/components/schemas/SaleChecklistCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleChecklistUpdateInput"
      responses:
        "200":
          description: Updated deal readiness checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleChecklist"
        "400":
          description: Checklist update failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The item is not ready to be confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/{id}/prepare:
    post:
      operationId: prepareSale
      tags: [sales]
      summary: Prepare and create a secure signing link
      description: Creates an immutable revision and development-only signing session.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Revision and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalePreparation"
        "400":
          description: Sale cannot be prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/{id}/final-checks:
    get:
      operationId: getSaleFinalChecks
      tags: [sales]
      summary: Run deterministic development final-sale checks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Final-sale checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalChecks"
        "404":
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/{id}/complete:
    post:
      operationId: completeSale
      tags: [sales]
      summary: Complete a development sale
      description: Rechecks all rules transactionally, marks the vehicle sold, and creates metadata-only invoice/Deal Vault records.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sale completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleCompletion"
        "404":
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Sale changed while completing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Final checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalCheckFailure"
  /sales/{id}/revoke-signing:
    post:
      operationId: revokeSaleSigning
      tags: [sales]
      summary: Revoke a pending development signing session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "404":
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No pending session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /signing/{token}:
    get:
      operationId: getSigningSession
      tags: [signing]
      summary: Get a development signing session
      description: Tokenized customer-facing development signing view. No PII is placed in the URL.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "200":
          description: Signing session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningSession"
        "404":
          description: Signing session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Signing session expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /signing/{token}/complete:
    post:
      operationId: completeSigningSession
      tags: [signing]
      summary: Complete the development demo signature
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            minLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSignatureInput"
      responses:
        "200":
          description: Demo signature recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningSessionCompletion"
        "400":
          description: Signature failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Signing session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Signing session is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dealer-settings:
    get:
      operationId: getDealerSettings
      tags: [dealer-settings]
      summary: Get the public dealer profile
      description: Returns the configured dealer identity, contact details, showroom copy, services, and legal links.
      responses:
        "200":
          description: Dealer settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerSettings"
        "500":
          description: Unable to load dealer settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateDealerSettings
      tags: [dealer-settings]
      summary: Replace the dealer profile
      description: Saves the complete dealer profile used by the public showroom and dealer portal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerSettingsInput"
      responses:
        "200":
          description: Updated dealer settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerSettings"
        "400":
          description: Dealer settings failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to update dealer settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /portal/session:
    get:
      operationId: getPortalSession
      tags: [portal]
      summary: Report the signed-in staff member's portal access
      description: Returns the authorisation state for the current Clerk session so the portal can distinguish "signed out" from "signed in but not staff".
      responses:
        "200":
          description: Portal access state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /portal/worklist:
    get:
      operationId: getPortalWorklist
      tags: [portal]
      summary: What needs chasing today
      description: Returns the day view work queue ordered by urgency rather than by arrival time.
      responses:
        "200":
          description: Today's work queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalWorklist"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorised for the portal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads/summary:
    get:
      operationId: getLeadChannelSummary
      tags: [leads]
      summary: What each channel produced
      responses:
        "200":
          description: Per-channel lead outcomes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadChannelSummary"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorised for the portal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads/{id}/activities:
    post:
      operationId: createLeadActivity
      tags: [leads]
      summary: Log a call, message or note and set the next action
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadActivityInput"
      responses:
        "201":
          description: Activity logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Activity failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorised for the portal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    DealerBrandColors:
      type: object
      additionalProperties: false
      properties:
        primaryHsl: { type: string, minLength: 1 }
        accentHsl: { type: string, minLength: 1 }
      required: [primaryHsl, accentHsl]
    DealerIdentity:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        logoText: { type: string, maxLength: 120 }
        logoAsset: { type: string, maxLength: 500 }
        brandColors:
          $ref: "#/components/schemas/DealerBrandColors"
      required: [name, logoText, logoAsset, brandColors]
    DealerContact:
      type: object
      additionalProperties: false
      properties:
        phone: { type: string, maxLength: 40 }
        whatsapp: { type: string, maxLength: 40 }
        email: { type: string, maxLength: 160 }
      required: [phone, whatsapp, email]
    DealerAddress:
      type: object
      additionalProperties: false
      properties:
        street: { type: string, maxLength: 160 }
        city: { type: string, maxLength: 80 }
        region: { type: string, maxLength: 80 }
        postcode: { type: string, maxLength: 20 }
        mapsUrl: { type: string, maxLength: 500 }
      required: [street, city, region, postcode, mapsUrl]
    DealerHoursItem:
      type: object
      additionalProperties: false
      properties:
        days: { type: string, minLength: 1, maxLength: 80 }
        times: { type: string, minLength: 1, maxLength: 80 }
      required: [days, times]
    DealerLegal:
      type: object
      additionalProperties: false
      properties:
        companyName: { type: string, maxLength: 160 }
        companyNumber: { type: string, maxLength: 80 }
        vatNumber: { type: string, maxLength: 80 }
        termsUrl: { type: string, maxLength: 500 }
        privacyUrl: { type: string, maxLength: 500 }
        cookieUrl: { type: string, maxLength: 500 }
      required: [companyName, companyNumber, vatNumber, termsUrl, privacyUrl, cookieUrl]
    DealerSocial:
      type: object
      additionalProperties: false
      properties:
        instagram: { type: string, maxLength: 500 }
        facebook: { type: string, maxLength: 500 }
        twitter: { type: string, maxLength: 500 }
      required: [instagram, facebook, twitter]
    DealerHero:
      type: object
      additionalProperties: false
      properties:
        announcement: { type: string, maxLength: 160 }
        copy: { type: string, minLength: 1, maxLength: 160 }
        subcopy: { type: string, minLength: 1, maxLength: 300 }
        primaryCta: { type: string, minLength: 1, maxLength: 80 }
        secondaryCta: { type: string, minLength: 1, maxLength: 80 }
      required: [announcement, copy, subcopy, primaryCta, secondaryCta]
    DealerService:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 300 }
        ctaLabel: { type: string, minLength: 1, maxLength: 80 }
      required: [enabled, title, description, ctaLabel]
    DealerBookViewing:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 300 }
        ctaLabel: { type: string, minLength: 1, maxLength: 80 }
      required: [title, description, ctaLabel]
    DealerWhyBuyItem:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 300 }
      required: [title, description]
    DealerSettings:
      type: object
      additionalProperties: false
      properties:
        identity: { $ref: "#/components/schemas/DealerIdentity" }
        contact: { $ref: "#/components/schemas/DealerContact" }
        address: { $ref: "#/components/schemas/DealerAddress" }
        hours:
          type: array
          maxItems: 14
          items: { $ref: "#/components/schemas/DealerHoursItem" }
        legal: { $ref: "#/components/schemas/DealerLegal" }
        social: { $ref: "#/components/schemas/DealerSocial" }
        hero: { $ref: "#/components/schemas/DealerHero" }
        warranty: { $ref: "#/components/schemas/DealerService" }
        delivery: { $ref: "#/components/schemas/DealerService" }
        partExchange: { $ref: "#/components/schemas/DealerService" }
        bookViewing: { $ref: "#/components/schemas/DealerBookViewing" }
        trustItems:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 120 }
        whyBuy:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/DealerWhyBuyItem" }
      required: [identity, contact, address, hours, legal, social, hero, warranty, delivery, partExchange, bookViewing, trustItems, whyBuy]
    DealerSettingsInput:
      allOf:
        - $ref: "#/components/schemas/DealerSettings"
    HealthStatus:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
    VehicleImage:
      type: object
