openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stock
    description: Shared showroom stock
  - name: enquiries
    description: Customer enquiries and viewing requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stock:
    get:
      operationId: getStock
      tags: [stock]
      summary: Get current showroom stock
      description: Returns the current full stock snapshot persisted in the database.
      responses:
        "200":
          description: Current showroom stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"
  /stock/imports/autotrader:
    post:
      operationId: importAutotraderStock
      tags: [stock]
      summary: Import a full Auto Trader stock snapshot
      description: Reconciles the database to the supplied complete Auto Trader snapshot. Schema version 1 is the only supported version.
      parameters:
        - in: header
          name: x-stock-import-secret
          required: true
          description: Shared secret used to authenticate the stock importer.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockImportEnvelope"
      responses:
        "201":
          description: Full snapshot imported for the first time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportResult"
        "200":
          description: Idempotent replay of a previously imported run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportResult"
        "400":
          description: Import envelope failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "401":
          description: Missing or invalid import secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "409":
          description: The run ID conflicts with an existing non-replayable import run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "422":
          description: Import was quarantined because its source records could not be safely applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "500":
          description: Unexpected processing or server configuration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [stock]
      summary: Get a vehicle
      parameters:
        - in: path
          name: id
          required: true
          description: Database identifier of the vehicle.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Vehicle details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /enquiries:
    get:
      operationId: getEnquiries
      tags: [enquiries]
      summary: List customer enquiries
      description: Returns customer enquiries for the configured dealer, newest first.
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [new, contacted, closed]
      responses:
        "200":
          description: Customer enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"
        "500":
          description: Unable to load enquiries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Create a customer enquiry
      description: Stores a website enquiry and snapshots the selected visible vehicle when provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Enquiry failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Selected vehicle was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to create enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /enquiries/{id}/status:
    patch:
      operationId: updateEnquiryStatus
      tags: [enquiries]
      summary: Update enquiry status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryStatusUpdate"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Enquiry failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to update enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
    VehicleImage:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          minLength: 1
        caption:
          type: [string, "null"]
      required:
        - url
        - caption
    VehicleSourceExtras:
      type: object
      additionalProperties: true
    VehicleSpecifications:
      type: object
      additionalProperties: true
    ImportedVehicle:
      type: object
      additionalProperties: false
      properties: &importedVehicleProperties
        advertId:
          type: string
          minLength: 1
        title:
          type: [string, "null"]
        variant:
          type: [string, "null"]
        make:
          type: [string, "null"]
        model:
          type: [string, "null"]
        trim:
          type: [string, "null"]
        year:
          type: [number, "null"]
          multipleOf: 1
        price:
          type: [number, "null"]
        priceType:
          type: [string, "null"]
        currency:
          type: [string, "null"]
        mileage:
          type: [number, "null"]
          multipleOf: 1
        mileageText:
          type: [string, "null"]
        registration:
          type: [string, "null"]
        registrationBand:
          type: [string, "null"]
        plate:
          type: [string, "null"]
        vrm:
          type: [string, "null"]
        vrmVerified:
          type: [boolean, "null"]
        fuel:
          type: [string, "null"]
        transmission:
          type: [string, "null"]
        bodyType:
          type: [string, "null"]
        engineSize:
          type: [string, "null"]
        engineCC:
          type: [number, "null"]
          multipleOf: 1
        doors:
          type: [number, "null"]
          multipleOf: 1
        seats:
          type: [number, "null"]
          multipleOf: 1
        colour:
          type: [string, "null"]
        emissionClass:
          type: [string, "null"]
        drivetrain:
          type: [string, "null"]
        owners:
          type: [number, "null"]
          multipleOf: 1
        writeOffCategory:
          type: [string, "null"]
        advertUrl:
          type: [string, "null"]
        dealerName:
          type: [string, "null"]
        dealerLocation:
          type: [string, "null"]
        imageCount:
          type: [number, "null"]
          multipleOf: 1
        heroImage:
          type: [string, "null"]
        images:
          type: array
          items:
            $ref: "#/components/schemas/VehicleImage"
        specifications:
          oneOf:
            - $ref: "#/components/schemas/VehicleSpecifications"
            - type: "null"
        sourceExtras:
          oneOf:
            - $ref: "#/components/schemas/VehicleSourceExtras"
            - type: "null"
      required:
        - advertId
        - title
        - variant
        - make
        - model
        - trim
        - year
        - price
        - priceType
        - currency
        - mileage
        - mileageText
        - registration
        - registrationBand
        - plate
        - vrm
        - vrmVerified
        - fuel
        - transmission
        - bodyType
        - engineSize
        - engineCC
        - doors
        - seats
        - colour
        - emissionClass
        - drivetrain
        - owners
        - writeOffCategory
        - advertUrl
        - dealerName
        - dealerLocation
        - imageCount
        - heroImage
        - images
        - specifications
        - sourceExtras
    Vehicle:
      type: object
      additionalProperties: false
      properties:
        <<: *importedVehicleProperties
        id:
          type: string
          minLength: 1
      required:
        - id
        - advertId
        - title
        - variant
        - make
        - model
        - trim
        - year
        - price
        - priceType
        - currency
        - mileage
        - mileageText
        - registration
        - registrationBand
        - plate
        - vrm
        - vrmVerified
        - fuel
        - transmission
        - bodyType
        - engineSize
        - engineCC
        - doors
        - seats
        - colour
        - emissionClass
        - drivetrain
        - owners
        - writeOffCategory
        - advertUrl
        - dealerName
        - dealerLocation
        - imageCount
        - heroImage
        - images
        - specifications
        - sourceExtras
    StockImportEnvelope:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        runId:
          type: string
          minLength: 1
        source:
          type: string
          enum: [autotrader]
        retailerId:
          type: string
          minLength: 1
        dealerName:
          type: string
          minLength: 1
        scrapedAt:
          type: string
          format: date-time
        complete:
          type: boolean
        expectedAdvertCount:
          type: number
          multipleOf: 1
          minimum: 0
        count:
          type: number
          multipleOf: 1
          minimum: 0
        failedAdvertIds:
          type: array
          items:
            type: string
            minLength: 1
        errors:
          type: array
          items:
            $ref: "#/components/schemas/SourceImportError"
        cars:
          type: array
          items:
            $ref: "#/components/schemas/ImportedVehicle"
      required:
        - schemaVersion
        - runId
        - source
        - retailerId
        - dealerName
        - scrapedAt
        - complete
        - expectedAdvertCount
        - count
        - failedAdvertIds
        - errors
        - cars
    Stock:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        dealerName:
          type: [string, "null"]
        dealerLocation:
          type: [string, "null"]
        count:
          type: number
          multipleOf: 1
          minimum: 0
        scrapedAt:
          type: ["string", "null"]
          format: date-time
        cars:
          type: array
          items:
            $ref: "#/components/schemas/Vehicle"
      required:
        - schemaVersion
        - dealerName
        - dealerLocation
        - count
        - scrapedAt
        - cars
    StockImportIssue:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        path:
          type: ["string", "null"]
        advertId:
          type: ["string", "null"]
      required:
        - code
        - message
        - path
        - advertId
    SourceImportError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        advertId:
          type: [string, "null"]
        sourceExtras:
          oneOf:
            - $ref: "#/components/schemas/VehicleSourceExtras"
            - type: "null"
      required:
        - code
        - message
        - advertId
        - sourceExtras
    StockImportResult:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        status:
          type: string
          enum: [imported, replayed]
        runId:
          type: string
          minLength: 1
        source:
          type: string
          enum: [autotrader]
        retailerId:
          type: string
          minLength: 1
        received:
          type: number
          multipleOf: 1
          minimum: 0
        created:
          type: number
          multipleOf: 1
          minimum: 0
        updated:
          type: number
          multipleOf: 1
          minimum: 0
        deleted:
          type: number
          multipleOf: 1
          minimum: 0
        unchanged:
          type: number
          multipleOf: 1
          minimum: 0
        errors:
          type: array
          items:
            $ref: "#/components/schemas/StockImportIssue"
      required:
        - schemaVersion
        - status
        - runId
        - source
        - retailerId
        - received
        - created
        - updated
        - deleted
        - unchanged
        - errors
    StockImportErrorResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [rejected, quarantined]
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StockImportIssue"
      required:
        - status
        - errors
    ApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          minLength: 1
      required:
        - error
    Enquiry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        dealerId:
          type: string
          minLength: 1
        vehicleId:
          type: [string, "null"]
        vehicleTitle:
          type: [string, "null"]
        vehicleRegistration:
          type: [string, "null"]
        vehiclePrice:
          type: [number, "null"]
          multipleOf: 1
        vehicleUrl:
          type: [string, "null"]
        type:
          type: string
          enum: [viewing, general, delivery, warranty, part_exchange]
        status:
          type: string
          enum: [new, contacted, closed]
        customerName:
          type: string
          minLength: 1
        email:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        preferredContact:
          type: [string, "null"]
        message:
          type: string
        source:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - dealerId
        - vehicleId
        - vehicleTitle
        - vehicleRegistration
        - vehiclePrice
        - vehicleUrl
        - type
        - status
        - customerName
        - email
        - phone
        - preferredContact
        - message
        - source
        - createdAt
        - updatedAt
    EnquiryInput:
      type: object
      additionalProperties: false
      properties:
        vehicleId:
          type: [string, "null"]
        type:
          type: string
          enum: [viewing, general, delivery, warranty, part_exchange]
        customerName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: [string, "null"]
        phone:
          type: [string, "null"]
          minLength: 5
          maxLength: 40
        preferredContact:
          type: [string, "null"]
          enum: [phone, email, whatsapp]
        message:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - vehicleId
        - type
        - customerName
        - email
        - phone
        - preferredContact
        - message
    EnquiryStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [new, contacted, closed]
      required:
        - status

