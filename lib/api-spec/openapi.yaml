openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stock
    description: Shared showroom stock
  - name: recent-handovers
    description: Anonymised completed handovers shown on the public showroom
  - name: enquiries
    description: Customer enquiries and viewing requests
  - name: reservations
    description: Online vehicle reservations with simulated payment
  - name: viewings
    description: Customer self-service management of a booked viewing
  - name: leads
    description: Buyer leads and their timeline, whatever channel they arrived on
  - name: sales
    description: Development-only dealer sales foundation
  - name: signing
    description: Development-only customer signing sessions
  - name: customer-intake
    description: Customer self-entry sessions for starting a dealer sale
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stock:
    get:
      operationId: getStock
      tags: [stock]
      summary: Get current showroom stock
      description: Returns the current full stock snapshot persisted in the database.
      responses:
        "200":
          description: Current showroom stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"
  /recent-handovers:
    get:
      operationId: getRecentHandovers
      tags: [recent-handovers]
      summary: Get recent public handovers
      description: Returns an anonymised, allowlisted projection of completed vehicle handovers for showroom social proof.
      responses:
        "200":
          description: Recent public handovers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentHandovers"
        "500":
          description: Unable to load recent handovers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /stock/imports/autotrader:
    post:
      operationId: importAutotraderStock
      tags: [stock]
      summary: Import a full Auto Trader stock snapshot
      description: Reconciles the database to the supplied complete Auto Trader snapshot. Schema version 1 is the only supported version.
      parameters:
        - in: header
          name: x-stock-import-secret
          required: true
          description: Shared secret used to authenticate the stock importer.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockImportEnvelope"
      responses:
        "201":
          description: Full snapshot imported for the first time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportResult"
        "200":
          description: Idempotent replay of a previously imported run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportResult"
        "400":
          description: Import envelope failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "401":
          description: Missing or invalid import secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "409":
          description: The run ID conflicts with an existing non-replayable import run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "422":
          description: Import was quarantined because its source records could not be safely applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "500":
          description: Unexpected processing or server configuration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
  /stock/imports/grok:
    post:
      operationId: importGrokStock
      tags: [stock]
      summary: Import a full stock snapshot from Grok
      description: Accepts the normalized stock snapshot produced by a Grok bot and applies it to the dealership's current stock feed.
      parameters:
        - in: header
          name: x-stock-import-secret
          required: true
          description: Shared secret used to authenticate the stock importer.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockImportEnvelope"
      responses:
        "201":
          description: Full snapshot imported for the first time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportResult"
        "200":
          description: Idempotent replay of a previously imported run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportResult"
        "400":
          description: Import envelope failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "401":
          description: Missing or invalid import secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "409":
          description: The run ID conflicts with an existing non-replayable import run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "422":
          description: Import was quarantined because its source records could not be safely applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
        "500":
          description: Unexpected processing or server configuration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockImportErrorResponse"
  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [stock]
      summary: Get a vehicle
      parameters:
        - in: path
          name: id
          required: true
          description: Database identifier of the vehicle.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Vehicle details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /reservations:
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Reserve a vehicle online
      description: Creates a real reservation and lead for an available vehicle. Payment is simulated; no money is received. Repeating the same idempotency key returns the original reservation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnlineReservationInput"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlineReservation" }
        "200":
          description: Previously created reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlineReservation" }
        "400":
          description: Invalid reservation details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: Vehicle unavailable, reservations disabled, or price or terms changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "500":
          description: Unable to reserve vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    get:
      operationId: listReservations
      tags: [reservations]
      summary: List online reservations for staff
      description: Requires an authenticated staff member and returns only the configured dealership's reservations.
      responses:
        "200":
          description: Online reservations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlineReservations" }
        "401":
          description: Staff sign-in required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Staff access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "500":
          description: Unable to load reservations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /reservations/{id}/cancel:
    post:
      operationId: cancelReservation
      tags: [reservations]
      summary: Cancel an online reservation
      description: Requires staff access. Releases the vehicle only when this reservation owns its current hold.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' }
      responses:
        "200":
          description: Cancelled reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlineReservation" }
        "401":
          description: Staff sign-in required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Staff access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Reservation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: Reservation cannot be cancelled in its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "500":
          description: Unable to cancel reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /staff/enquiries:
    post:
      operationId: createStaffEnquiry
      tags: [enquiries]
      summary: Staff-only createStaffEnquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffEnquiryInput"
      responses:
        "201":
          description: Enquiry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff access required
        "404":
          description: Record unavailable
        "409":
          description: Booking or availability has changed
  /staff/enquiries/{id}/follow-up:
    post:
      operationId: changeStaffFollowUp
      tags: [enquiries]
      summary: Staff-only changeStaffFollowUp
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffFollowUpChange"
      responses:
        "200":
          description: Enquiry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff access required
        "404":
          description: Record unavailable
        "409":
          description: Booking or availability has changed
  /staff/enquiries/{id}/appointment:
    post:
      operationId: changeStaffAppointment
      tags: [enquiries]
      summary: Staff-only changeStaffAppointment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAppointmentChange"
      responses:
        "200":
          description: Enquiry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staff access required
        "404":
          description: Record unavailable
        "409":
          description: Booking or availability has changed
  /enquiries:
    get:
      operationId: getEnquiries
      tags: [enquiries]
      summary: List customer enquiries
      description: Returns customer enquiries for the configured dealer, newest first.
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [new, contacted, closed]
      responses:
        "200":
          description: Customer enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"
        "500":
          description: Unable to load enquiries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Create a customer enquiry
      description: Stores a website enquiry and snapshots the selected visible vehicle when provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Enquiry failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Selected vehicle was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to create enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /staff/enquiries/{id}/availability:
    get:
      operationId: getStaffAppointmentAvailability
      tags: [enquiries]
      summary: Get available viewing appointments
      description: Returns bookable 30-minute viewing slots for a date in the dealership timezone.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: date
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Viewing availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryAvailability"
        "400":
          description: Invalid or unavailable date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to load availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /enquiries/availability:
    get:
      operationId: getEnquiryAvailability
      tags: [enquiries]
      summary: Get available viewing appointments
      description: Returns bookable 30-minute viewing slots for a date in the dealership timezone.
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Viewing availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryAvailability"
        "400":
          description: Invalid or unavailable date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to load availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /enquiries/{id}/status:
    patch:
      operationId: updateEnquiryStatus
      tags: [enquiries]
      summary: Update enquiry status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryStatusUpdate"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Enquiry failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to update enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /viewings/{token}:
    get:
      operationId: getViewingBooking
      tags: [viewings]
      summary: Get a booked viewing from its customer link
      description: Resolves the secure one-off link sent to the customer so they can manage their own viewing.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The booked viewing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewingBooking"
        "404":
          description: Link is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to load the viewing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /viewings/{token}/reschedule:
    post:
      operationId: rescheduleViewing
      tags: [viewings]
      summary: Move a booked viewing to another slot
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewingReschedule"
      responses:
        "200":
          description: The rescheduled viewing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewingBooking"
        "400":
          description: Requested time is not bookable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Link is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Requested slot has just been taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to reschedule the viewing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /viewings/{token}/cancel:
    post:
      operationId: cancelViewing
      tags: [viewings]
      summary: Cancel a booked viewing
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewingCancellation"
      responses:
        "200":
          description: The cancelled viewing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewingBooking"
        "400":
          description: Cancellation failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Link is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to cancel the viewing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contact-intents:
    get:
      operationId: getContactIntents
      tags: [enquiries]
      summary: List recent call and WhatsApp taps
      description: Requires authorized staff. Returns the most recent call/WhatsApp taps for the configured dealer, newest first.
      parameters:
        - in: query
          name: unattributed
          required: false
          description: When true, only taps that are not yet attached to an enquiry are returned.
          schema:
            type: boolean
      responses:
        "200":
          description: Recent contact intents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactIntent"
        "401":
          description: Staff sign-in required
        "403":
          description: Account is not authorized for the dealer portal
        "500":
          description: Unable to load contact intents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: recordContactIntent
      tags: [enquiries]
      summary: Record a call or WhatsApp tap against a car
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactIntentInput"
      responses:
        "201":
          description: Contact intent recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactIntent"
        "400":
          description: Contact intent failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many taps recorded from this browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to record the contact intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      summary: List leads
      description: Returns leads for the configured dealer, newest first, whatever channel they arrived on.
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - in: query
          name: stage
          required: false
          schema:
            type: string
            enum: [open, all, new, qualifying, viewing_booked, offer, reserved, sale_agreed, collected, won, lost]
        - in: query
          name: source
          required: false
          schema:
            type: string
            enum: [all, website_form, phone, whatsapp, walk_in, marketplace, social]
        - in: query
          name: owner
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - in: query
          name: state
          required: false
          description: Limit to leads that are still live or already closed.
          schema:
            type: string
            enum: [open, closed]
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid lead filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to load leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead by hand
      description: Records a lead that arrived by phone, WhatsApp, walk-in, marketplace or social, rather than through the website form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Lead failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Selected vehicle was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to create lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead with its timeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Lead with its timeline and any sales it produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Invalid lead id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unable to load lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead details from the dealer portal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Update failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorised for the portal
